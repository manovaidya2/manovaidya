# Include from nginx's http context (normally sites-enabled on Ubuntu).
# Adapt root/include/certificate paths to the server before enabling.
include /var/www/manovaidya/frontend/deploy/canonical-redirects.map;

server {
    listen 80;
    listen [::]:80;
    server_name manovaidya.org www.manovaidya.org;

    if ($seo_redirect_path != "") {
        return 301 https://manovaidya.org$seo_redirect_path$is_args$args;
    }
    return 301 https://manovaidya.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.manovaidya.org;
    ssl_certificate /etc/letsencrypt/live/manovaidya.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manovaidya.org/privkey.pem;

    if ($seo_redirect_path != "") {
        return 301 https://manovaidya.org$seo_redirect_path$is_args$args;
    }
    return 301 https://manovaidya.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name manovaidya.org;
    ssl_certificate /etc/letsencrypt/live/manovaidya.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manovaidya.org/privkey.pem;
    root /var/www/manovaidya/frontend/dist;
    index index.html;
    # Internal error rendering preserves the original missing URL and HTTP 404.
    error_page 404 =404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /404.html =404;
    }

    # Canonicalization happens before directory/index handling, in one hop.
    if ($seo_redirect_path != "") {
        return 301 https://manovaidya.org$seo_redirect_path$is_args$args;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    # Build-time template used only by the backend for fresh detail pages.
    location = /app-shell.html { return 404; }

    # Blogs/case studies published after the last build have no prerendered HTML.
    # The backend checks the CMS: published -> 200 page, otherwise -> 404 page.
    location ~ ^/(blog|case-studies)/[^/]+/$ {
        try_files $uri $uri/ @fresh_detail;
    }
    location @fresh_detail {
        # Must match the backend's PORT (default 5012).
        proxy_pass http://127.0.0.1:5012;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        # Unknown slugs and backend failures still render the static 404 page.
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 =404 /404.html;
    }

    location / {
        # A canonical directory URL is served directly with its prerendered HTML.
        # Unknown pages must not receive the home page with status 200.
        try_files $uri $uri/ =404;
    }
}
