# Include from nginx's http context (normally sites-enabled on Ubuntu).
# Adapt root/include/certificate paths to the server before enabling.
include /var/www/manovaidya/frontend/deploy/canonical-redirects.map;

server {
    listen 80;
    listen [::]:80;
    server_name manovaidya.org www.manovaidya.org;

    if ($seo_redirect_path != "") {
        return 301 https://manovaidya.org$seo_redirect_path$is_args$args;
    }
    return 301 https://manovaidya.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.manovaidya.org;
    ssl_certificate /etc/letsencrypt/live/manovaidya.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manovaidya.org/privkey.pem;

    if ($seo_redirect_path != "") {
        return 301 https://manovaidya.org$seo_redirect_path$is_args$args;
    }
    return 301 https://manovaidya.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name manovaidya.org;
    ssl_certificate /etc/letsencrypt/live/manovaidya.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manovaidya.org/privkey.pem;
    root /var/www/manovaidya/frontend/dist;
    index index.html;

    # Canonicalization happens before directory/index handling, in one hop.
    if ($seo_redirect_path != "") {
        return 301 https://manovaidya.org$seo_redirect_path$is_args$args;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }

    location / {
        # A canonical directory URL is served directly with its prerendered HTML.
        # Unknown pages must not receive the home page with status 200.
        try_files $uri $uri/ =404;
    }
}
